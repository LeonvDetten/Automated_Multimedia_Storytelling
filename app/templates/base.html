<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Automated Multimedia Storytelling" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}" />
  </head>
  <body>
    <header class="header">
      <h1>Fablewood Starlight</h1>
      <p>Fairy-tale episode generator in a glowing forest mood.</p>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
